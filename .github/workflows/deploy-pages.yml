# Publishes the handbook to GitHub Pages.
#
# The repository root IS the site — no build step. This workflow only runs the
# same checks `npm run check` runs locally (manifest freshness + parser
# self-check), then uploads the root and publishes it. `.nojekyll` at the root
# tells Pages to serve the tree as-is instead of running Jekyll.
#
# First run: Settings → Pages → Source → "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the manifest and run the self-check
        run: npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site (the repository root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
